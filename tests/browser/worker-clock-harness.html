<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alumina worker clock harness</title>
  </head>
  <body>
    <pre id="result" data-status="starting">starting</pre>
    <script type="module">
      const output = document.querySelector("#result");
      const worker = new Worker("/dist/alumina-worker.js", {
        type: "module",
        name: "alumina-clock-harness",
      });
      let configured = false;
      let timeout;
      let latestSnapshot;
      let isolatedHealthFailureSnapshot;
      let isolatedCapabilityFailureSnapshot;
      let capabilityDocument;
      const telemetryDocuments = [];
      let waveformDocument;
      const waveformDocuments = [];
      let waveformRequested = false;
      let repeatedWaveformRequested = false;
      let firstWaveformCaptureId;
      const eventKinds = [];
      const expectation =
        new URLSearchParams(location.search).get("expect") ?? "qualified";

      const finish = (status, detail) => {
        output.dataset.status = status;
        output.textContent = JSON.stringify(detail, null, 2);
        document.title = `Alumina worker clock harness: ${status}`;
        if (status !== "sampling") {
          worker.terminate();
        }
      };

      const requestWaveform = (durationCycles) => {
        worker.postMessage(
          JSON.stringify({
            schema_version: 5,
            command: {
              kind: "capture_waveform",
              request: {
                connection_id: 1,
                channels: [
                  [1, 0, 22, 0],
                  [1, 0, 32, 0],
                  [1, 0, 33, 0],
                  [1, 0, 35, 0],
                ],
                duration_cycles: durationCycles,
              },
            },
          }),
        );
      };

      worker.onerror = (event) => {
        clearTimeout(timeout);
        finish("failed", { error: event.message });
      };

      worker.onmessage = (message) => {
        let envelope;
        try {
          envelope = JSON.parse(message.data);
        } catch (error) {
          clearTimeout(timeout);
          finish("failed", { error: String(error) });
          return;
        }
        if (envelope.schema_version !== 5) {
          clearTimeout(timeout);
          finish("failed", {
            error: "worker schema version mismatch",
            schema_version: envelope.schema_version,
          });
          return;
        }
        const event = envelope.event;
        eventKinds.push(event.kind);
        if (event.kind === "ready" && !configured) {
          configured = true;
          timeout = setTimeout(() => {
            finish("failed", {
              error: "clock qualification timed out",
              event_kinds: eventKinds,
              latest_snapshot: latestSnapshot,
              isolated_health_failure_snapshot: isolatedHealthFailureSnapshot,
              isolated_capability_failure_snapshot:
                isolatedCapabilityFailureSnapshot,
              capability_document: capabilityDocument,
              telemetry_documents: telemetryDocuments,
              waveform_document: waveformDocument,
              waveform_documents: waveformDocuments,
            });
          }, 30000);
          worker.postMessage(
            JSON.stringify({
              schema_version: 5,
              command: {
                kind: "configure",
                request: {
                  connection_id: 1,
                  label: "authenticated HTTP simulator",
                  origin: "http://127.0.0.1:8098",
                  secret: Array.from(
                    new TextEncoder().encode("alumina-development"),
                  ),
                  sampling: {
                    maximum_round_trip_ns: 1000000000,
                    maximum_device_processing_cycles: 2000000,
                    maximum_drift_ppm: 250,
                    maximum_sample_age_ns: 5000000000,
                    maximum_schedule_horizon_ns: 30000000000,
                    minimum_schedule_lead_ns: 500000000,
                    minimum_samples: 4,
                    maximum_timer_error_ns: 2000000,
                    maximum_uncertainty_cycles: 1000000,
                    heartbeat_interval_ms: 100,
                    runtime_health_interval_ms: 1000,
                  },
                },
              },
            }),
          );
          return;
        }
        if (event.kind === "capability_document") {
          if (capabilityDocument !== undefined) {
            clearTimeout(timeout);
            finish("failed", {
              error: "capability document was emitted more than once",
              event_kinds: eventKinds,
            });
            return;
          }
          const capability = event.capability;
          const magic = capability.document.slice(0, 8);
          const validMagic =
            JSON.stringify(magic) ===
            JSON.stringify(Array.from(new TextEncoder().encode("ALMCAP02")));
          if (
            capability.connection_id !== 1 ||
            capability.generation < 1 ||
            capability.identity.document_bytes !== capability.document.length ||
            capability.identity.digest.length !== 32 ||
            !validMagic
          ) {
            clearTimeout(timeout);
            finish("failed", {
              error: "capability document event was malformed",
              capability,
            });
            return;
          }
          capabilityDocument = capability;
          return;
        }
        if (event.kind === "telemetry_document") {
          const telemetry = event.telemetry;
          const subscription = Uint8Array.from(telemetry.subscription);
          const record = Uint8Array.from(telemetry.event);
          const subscriptionView = new DataView(subscription.buffer);
          const recordView = new DataView(record.buffer);
          const subscriptionMagic = new TextDecoder().decode(subscription.slice(0, 8));
          const eventMagic = new TextDecoder().decode(record.slice(0, 8));
          const eventSequence = Number(recordView.getBigUint64(56, true));
          const droppedEvents = Number(recordView.getBigUint64(64, true));
          const snapshotCycle = Number(recordView.getBigUint64(240, true));
          const overviewSequence = Number(recordView.getBigUint64(248, true));
          const sampleCount = recordView.getUint32(256, true);
          const previous = telemetryDocuments.at(-1);
          if (
            telemetry.connection_id !== 1 ||
            telemetry.generation < 1 ||
            subscription.length !== 176 ||
            record.length !== 432 ||
            subscriptionMagic !== "ALMTLS01" ||
            eventMagic !== "ALMTEV01" ||
            subscriptionView.getUint32(12, true) !== subscription.length ||
            recordView.getUint32(12, true) !== record.length ||
            subscriptionView.getBigUint64(16, true) !==
              recordView.getBigUint64(16, true) ||
            eventSequence === 0 ||
            overviewSequence !== eventSequence ||
            sampleCount !== 4 ||
            (previous !== undefined &&
              (eventSequence <= previous.event_sequence ||
                droppedEvents < previous.dropped_events ||
                snapshotCycle <= previous.snapshot_cycle))
          ) {
            clearTimeout(timeout);
            finish("failed", {
              error: "telemetry document event was malformed or regressed",
              telemetry,
              previous,
            });
            return;
          }
          telemetryDocuments.push({
            generation: telemetry.generation,
            event_sequence: eventSequence,
            dropped_events: droppedEvents,
            snapshot_cycle: snapshotCycle,
            subscription_bytes: subscription.length,
            event_bytes: record.length,
          });
          return;
        }
        if (event.kind === "waveform_document") {
          const maximumDocuments = expectation === "waveform-repeat" ? 2 : 1;
          if (waveformDocuments.length >= maximumDocuments) {
            clearTimeout(timeout);
            finish("failed", {
              error: "waveform document count exceeded the expectation",
              event_kinds: eventKinds,
              waveform_documents: waveformDocuments,
            });
            return;
          }
          const waveform = event.waveform;
          const magic = waveform.record.slice(0, 8);
          const captureId = waveform.record.slice(128, 144);
          const recordBytes = Uint8Array.from(waveform.record);
          const requestedDuration = Number(
            new DataView(recordBytes.buffer).getBigUint64(168, true),
          );
          const expectedDuration =
            expectation === "waveform-repeat" && waveformDocuments.length === 1
              ? 3000
              : 2000;
          const validMagic =
            JSON.stringify(magic) ===
            JSON.stringify(Array.from(new TextEncoder().encode("ALMDIG01")));
          if (
            waveform.connection_id !== 1 ||
            waveform.generation < 1 ||
            waveform.record.length < 224 ||
            captureId.every((byte) => byte === 0) ||
            requestedDuration !== expectedDuration ||
            !validMagic
          ) {
            clearTimeout(timeout);
            finish("failed", {
              error: "waveform document event was malformed",
              waveform,
            });
            return;
          }
          waveformDocument = waveform;
          waveformDocuments.push(waveform);
          return;
        }
        if (event.kind === "snapshot") {
          const snapshot = event.snapshot;
          latestSnapshot = snapshot;
          const isolatedHealthFailure =
            snapshot.phase === "clock_qualified" &&
            snapshot.consecutive_failures === 0 &&
            snapshot.last_error === null &&
            snapshot.runtime_health_consecutive_failures >= 1 &&
            snapshot.runtime_health_last_error !== null;
          if (isolatedHealthFailure) {
            isolatedHealthFailureSnapshot = snapshot;
          }
          const isolatedCapabilityFailure =
            snapshot.consecutive_failures === 0 &&
            snapshot.last_error === null &&
            snapshot.capability_consecutive_failures >= 1 &&
            snapshot.capability_last_error !== null;
          if (isolatedCapabilityFailure) {
            isolatedCapabilityFailureSnapshot = snapshot;
          }
          const health = snapshot.runtime_health;
          const runtimeHealthAvailable =
            snapshot.runtime_health_availability === "available" &&
            health !== null &&
            health.command_queue.depth === 0 &&
            health.command_queue.capacity === 8 &&
            health.work_queue.depth === 0 &&
            health.work_queue.capacity === 8 &&
            health.telemetry_queue.depth === 1 &&
            health.telemetry_queue.capacity === 32 &&
            health.service_stack.domain === "service_core" &&
            health.service_stack.samples >= 1 &&
            health.realtime_stack !== null &&
            health.realtime_stack.domain === "realtime_core" &&
            health.realtime_stack.samples >= 1 &&
            health.realtime_stack_fresh === true &&
            snapshot.runtime_health_consecutive_failures === 0 &&
            snapshot.runtime_health_last_error === null;
          const qualified =
            snapshot.phase === "clock_qualified" &&
            snapshot.accepted_samples >= 5 &&
            snapshot.estimate !== null &&
            snapshot.history.length >= 4 &&
            runtimeHealthAvailable &&
            snapshot.capability_phase === "complete" &&
            snapshot.capability_identity !== null &&
            snapshot.capability_received_bytes ===
              snapshot.capability_identity.document_bytes &&
            snapshot.capability_consecutive_failures === 0 &&
            snapshot.capability_last_error === null &&
            snapshot.device_identity !== null &&
            snapshot.device_identity.board_id === "mks-tinybee-v1" &&
            snapshot.device_identity.device_id.length === 16 &&
            capabilityDocument !== undefined &&
            capabilityDocument.generation === snapshot.generation &&
            capabilityDocument.identity.document_bytes ===
              snapshot.capability_identity.document_bytes &&
            JSON.stringify(capabilityDocument.identity.digest) ===
              JSON.stringify(snapshot.capability_identity.digest);
          const waveformComplete =
            snapshot.waveform_phase === "complete" &&
            snapshot.waveform_capture_id !== null &&
            snapshot.waveform_received_bytes ===
              snapshot.waveform_total_bytes &&
            snapshot.waveform_total_bytes > 0 &&
            snapshot.waveform_consecutive_failures === 0 &&
            snapshot.waveform_last_error === null &&
            waveformDocument !== undefined &&
            waveformDocument.generation === snapshot.generation &&
            waveformDocument.record.length === snapshot.waveform_total_bytes &&
            JSON.stringify(waveformDocument.record.slice(128, 144)) ===
              JSON.stringify(snapshot.waveform_capture_id);
          const telemetryComplete =
            snapshot.telemetry_phase === "active" &&
            snapshot.telemetry_subscription_id !== null &&
            snapshot.telemetry_subscription_digest !== null &&
            snapshot.telemetry_subscription_digest.length === 32 &&
            snapshot.telemetry_event_sequence >= 2 &&
            snapshot.telemetry_dropped_events === 0 &&
            snapshot.telemetry_consecutive_failures === 0 &&
            snapshot.telemetry_last_error === null &&
            telemetryDocuments.length >= 2 &&
            telemetryDocuments.at(-1).generation === snapshot.generation &&
            telemetryDocuments.at(-1).event_sequence ===
              snapshot.telemetry_event_sequence;
          const conservativelyRejected =
            snapshot.rejected_samples >= 3 &&
            snapshot.accepted_samples === 0 &&
            snapshot.estimate === null;
          if (expectation === "qualified" && qualified) {
            clearTimeout(timeout);
            finish("passed", {
              expectation,
              capability_document: capabilityDocument,
              snapshot,
            });
          } else if (
            expectation === "telemetry" &&
            qualified &&
            telemetryComplete
          ) {
            clearTimeout(timeout);
            finish("passed", {
              expectation,
              capability_document: capabilityDocument,
              telemetry_documents: telemetryDocuments,
              snapshot,
            });
          } else if (
            expectation === "waveform" &&
            qualified &&
            !waveformRequested
          ) {
            waveformRequested = true;
            requestWaveform(2000);
            finish("sampling", snapshot);
          } else if (
            expectation === "waveform" &&
            qualified &&
            waveformComplete
          ) {
            clearTimeout(timeout);
            finish("passed", {
              expectation,
              capability_document: capabilityDocument,
              waveform_document: waveformDocument,
              snapshot,
            });
          } else if (
            expectation === "waveform-repeat" &&
            qualified &&
            !waveformRequested
          ) {
            waveformRequested = true;
            requestWaveform(2000);
            finish("sampling", snapshot);
          } else if (
            expectation === "waveform-repeat" &&
            qualified &&
            waveformComplete &&
            !repeatedWaveformRequested
          ) {
            repeatedWaveformRequested = true;
            firstWaveformCaptureId = JSON.stringify(
              snapshot.waveform_capture_id,
            );
            requestWaveform(3000);
            finish("sampling", snapshot);
          } else if (
            expectation === "waveform-repeat" &&
            qualified &&
            waveformComplete &&
            repeatedWaveformRequested &&
            waveformDocuments.length === 2 &&
            JSON.stringify(snapshot.waveform_capture_id) !==
              firstWaveformCaptureId
          ) {
            clearTimeout(timeout);
            finish("passed", {
              expectation,
              capability_document: capabilityDocument,
              waveform_documents: waveformDocuments,
              snapshot,
            });
          } else if (
            expectation === "health-retry" &&
            qualified &&
            isolatedHealthFailureSnapshot !== undefined
          ) {
            clearTimeout(timeout);
            finish("passed", {
              expectation,
              isolated_health_failure_snapshot: isolatedHealthFailureSnapshot,
              capability_document: capabilityDocument,
              recovered_snapshot: snapshot,
            });
          } else if (
            expectation === "capability-retry" &&
            qualified &&
            isolatedCapabilityFailureSnapshot !== undefined
          ) {
            clearTimeout(timeout);
            finish("passed", {
              expectation,
              isolated_capability_failure_snapshot:
                isolatedCapabilityFailureSnapshot,
              capability_document: capabilityDocument,
              recovered_snapshot: snapshot,
            });
          } else if (
            expectation === "conservative-rejection" &&
            conservativelyRejected
          ) {
            clearTimeout(timeout);
            finish("passed", { expectation, snapshot });
          } else {
            finish("sampling", snapshot);
          }
          return;
        }
        if (event.kind === "fatal" || event.kind === "command_rejected") {
          clearTimeout(timeout);
          finish("failed", event);
        }
      };
    </script>
  </body>
</html>
