<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alumina worker clock harness</title>
  </head>
  <body>
    <pre id="result" data-status="starting">starting</pre>
    <script type="module">
      const output = document.querySelector("#result");
      const worker = new Worker("/dist/alumina-worker.js", {
        type: "module",
        name: "alumina-clock-harness",
      });
      let configured = false;
      let timeout;
      let latestSnapshot;
      const deviceSnapshots = new Map();
      let cachedJobRequests = [];
      let cachedJobRequest;
      let cachedJobRequestIndex = 0;
      let cachedJobStaged = false;
      let cachedJobStarted = false;
      let cachedJobClearing = false;
      let cachedJobSnapshotCount = 0;
      let latestCachedJobSnapshot;
      const cachedJobTransitions = [];
      const cachedJobFailureObservations = [];
      let cachedJobRecovered = false;
      let priorCachedJobFailureState;
      const completedCachedJobs = [];
      let priorCachedJobState;
      let isolatedHealthFailureSnapshot;
      let isolatedCapabilityFailureSnapshot;
      let capabilityDocument;
      const capabilityDocuments = new Map();
      const telemetryDocuments = [];
      let waveformDocument;
      const waveformDocuments = [];
      let waveformRequested = false;
      let repeatedWaveformRequested = false;
      let firstWaveformCaptureId;
      const eventKinds = [];
      const expectation =
        new URLSearchParams(location.search).get("expect") ?? "qualified";
      const cachedJobExpectation =
        expectation === "cached-job" ||
        expectation === "cached-job-repeat" ||
        expectation === "cached-job-recovery" ||
        expectation === "cached-job-confirm-recovery";

      window.installCachedJobRequest = (requestOrRequests) => {
        const requests = Array.isArray(requestOrRequests)
          ? requestOrRequests
          : [requestOrRequests];
        const expectedCount = expectation === "cached-job-repeat" ? 2 : 1;
        if (!cachedJobExpectation || requests.length !== expectedCount) {
          finish("failed", {
            error: `expected ${expectedCount} cached-job request(s) for ${expectation}`,
          });
          return;
        }
        cachedJobRequests = requests;
        cachedJobRequestIndex = 0;
        cachedJobRequest = requests[0];
        maybeStageCachedJob();
      };

      const exactArray = (left, right) =>
        JSON.stringify(left) === JSON.stringify(right);

      const compactCachedJobSnapshot = (snapshot) => ({
        job_id: snapshot.job_id,
        phase: snapshot.phase,
        execution_mode: snapshot.execution_mode,
        target_ui_ns: snapshot.target_ui_ns,
        consecutive_failures: snapshot.consecutive_failures,
        last_error: snapshot.last_error,
        participants: snapshot.participants.map((participant) => ({
          connection_id: participant.connection_id,
          generation: participant.generation,
          cache_artifact: participant.cache_artifact,
          cache_phase: participant.cache_phase,
          accepted_bytes: participant.accepted_bytes,
          total_bytes: participant.total_bytes,
          next_chunk: participant.next_chunk,
          schedule_phase: participant.schedule_phase,
          local_start_cycle: participant.local_start_cycle,
        })),
      });

      const compactDeviceSnapshot = (snapshot) => ({
        connection_id: snapshot.connection_id,
        generation: snapshot.generation,
        phase: snapshot.phase,
        boot_id: snapshot.boot_id,
        device_identity: snapshot.device_identity,
        accepted_samples: snapshot.accepted_samples,
        rejected_samples: snapshot.rejected_samples,
        consecutive_failures: snapshot.consecutive_failures,
        last_error: snapshot.last_error,
        runtime_health_availability: snapshot.runtime_health_availability,
        runtime_health_consecutive_failures:
          snapshot.runtime_health_consecutive_failures,
        runtime_health_last_error: snapshot.runtime_health_last_error,
        configuration_availability: snapshot.configuration_availability,
        configuration: snapshot.configuration,
        configuration_consecutive_failures:
          snapshot.configuration_consecutive_failures,
        configuration_last_error: snapshot.configuration_last_error,
        capability_phase: snapshot.capability_phase,
        capability_identity: snapshot.capability_identity,
        capability_consecutive_failures:
          snapshot.capability_consecutive_failures,
        capability_last_error: snapshot.capability_last_error,
        telemetry_phase: snapshot.telemetry_phase,
        telemetry_event_sequence: snapshot.telemetry_event_sequence,
        telemetry_dropped_events: snapshot.telemetry_dropped_events,
        telemetry_consecutive_failures: snapshot.telemetry_consecutive_failures,
        telemetry_last_error: snapshot.telemetry_last_error,
      });

      const compactDeviceSnapshots = () =>
        Array.from(deviceSnapshots.values(), compactDeviceSnapshot);

      const recordCachedJobSnapshot = (snapshot) => {
        cachedJobSnapshotCount += 1;
        latestCachedJobSnapshot = compactCachedJobSnapshot(snapshot);
        const state = JSON.stringify({
          phase: latestCachedJobSnapshot.phase,
          participants: latestCachedJobSnapshot.participants.map(
            (participant) => [
              participant.cache_artifact,
              participant.cache_phase,
              participant.schedule_phase,
            ],
          ),
        });
        if (state !== priorCachedJobState) {
          cachedJobTransitions.push(latestCachedJobSnapshot);
          priorCachedJobState = state;
        }
        if (latestCachedJobSnapshot.consecutive_failures > 0) {
          const failureState = JSON.stringify([
            latestCachedJobSnapshot.consecutive_failures,
            latestCachedJobSnapshot.last_error,
          ]);
          if (
            failureState !== priorCachedJobFailureState &&
            cachedJobFailureObservations.length < 16
          ) {
            cachedJobFailureObservations.push(latestCachedJobSnapshot);
            priorCachedJobFailureState = failureState;
          }
        } else if (cachedJobFailureObservations.length > 0) {
          cachedJobRecovered = true;
          priorCachedJobFailureState = undefined;
        }
      };

      window.inspectCachedJobHarness = () => ({
        staged: cachedJobStaged,
        started: cachedJobStarted,
        clearing: cachedJobClearing,
        request_index: cachedJobRequestIndex,
        request_count: cachedJobRequests.length,
        snapshot_count: cachedJobSnapshotCount,
        latest_cached_job_snapshot: latestCachedJobSnapshot,
        cached_job_transitions: cachedJobTransitions,
        cached_job_failure_observations: cachedJobFailureObservations,
        cached_job_recovered: cachedJobRecovered,
        completed_cached_jobs: completedCachedJobs,
      });

      const maybeStageCachedJob = () => {
        if (
          !cachedJobExpectation ||
          cachedJobRequest === undefined ||
          cachedJobStaged ||
          cachedJobClearing
        ) {
          return;
        }
        const ready = cachedJobRequest.participants.every((participant) => {
          const snapshot = deviceSnapshots.get(participant.connection_id);
          const capability = capabilityDocuments.get(participant.connection_id);
          return (
            snapshot !== undefined &&
            capability !== undefined &&
            Array.isArray(participant.descriptor) &&
            participant.descriptor.length > 0 &&
            snapshot.generation === participant.generation &&
            capability.generation === participant.generation &&
            snapshot.phase === "clock_qualified" &&
            snapshot.device_identity?.board_id.startsWith("sim-") &&
            exactArray(
              snapshot.device_identity.device_id,
              participant.device_id,
            ) &&
            snapshot.capability_phase === "complete" &&
            exactArray(
              snapshot.capability_identity?.digest,
              capability.identity.digest,
            ) &&
            snapshot.configuration_availability === "available" &&
            snapshot.configuration?.phase === "active" &&
            snapshot.configuration.jobs_authorized === true &&
            snapshot.configuration_consecutive_failures === 0 &&
            snapshot.configuration_last_error === null
          );
        });
        if (!ready) return;
        cachedJobStaged = true;
        worker.postMessage(
          JSON.stringify({
            schema_version: 6,
            command: { kind: "stage_cached_job", request: cachedJobRequest },
          }),
        );
      };

      const finish = (status, detail) => {
        output.dataset.status = status;
        output.textContent = JSON.stringify(detail, null, 2);
        document.title = `Alumina worker clock harness: ${status}`;
        if (status !== "sampling") {
          worker.terminate();
        }
      };

      const requestWaveform = (durationCycles) => {
        worker.postMessage(
          JSON.stringify({
            schema_version: 6,
            command: {
              kind: "capture_waveform",
              request: {
                connection_id: 1,
                channels: [
                  [1, 0, 22, 0],
                  [1, 0, 32, 0],
                  [1, 0, 33, 0],
                  [1, 0, 35, 0],
                ],
                duration_cycles: durationCycles,
              },
            },
          }),
        );
      };

      worker.onerror = (event) => {
        clearTimeout(timeout);
        finish("failed", { error: event.message });
      };

      worker.onmessage = (message) => {
        let envelope;
        try {
          envelope = JSON.parse(message.data);
        } catch (error) {
          clearTimeout(timeout);
          finish("failed", { error: String(error) });
          return;
        }
        if (envelope.schema_version !== 6) {
          clearTimeout(timeout);
          finish("failed", {
            error: "worker schema version mismatch",
            schema_version: envelope.schema_version,
          });
          return;
        }
        const event = envelope.event;
        eventKinds.push(event.kind);
        if (event.kind === "ready" && !configured) {
          configured = true;
          timeout = setTimeout(() => {
            finish("failed", {
              error:
                cachedJobExpectation
                  ? "cached-job workflow timed out"
                  : "clock qualification timed out",
              event_kinds: eventKinds,
              latest_snapshot: latestSnapshot,
              isolated_health_failure_snapshot: isolatedHealthFailureSnapshot,
              isolated_capability_failure_snapshot:
                isolatedCapabilityFailureSnapshot,
              capability_document: capabilityDocument,
              telemetry_documents: telemetryDocuments,
              waveform_document: waveformDocument,
              waveform_documents: waveformDocuments,
              cached_job_snapshot_count: cachedJobSnapshotCount,
              latest_cached_job_snapshot: latestCachedJobSnapshot,
              cached_job_transitions: cachedJobTransitions,
              cached_job_failure_observations: cachedJobFailureObservations,
              cached_job_recovered: cachedJobRecovered,
              completed_cached_jobs: completedCachedJobs,
              device_snapshots: compactDeviceSnapshots(),
            });
          }, cachedJobExpectation ? 180000 : 30000);
          const simulatorCount = cachedJobExpectation ? 2 : 1;
          for (let index = 0; index < simulatorCount; index += 1) {
            worker.postMessage(
              JSON.stringify({
                schema_version: 6,
                command: {
                  kind: "configure",
                  request: {
                    connection_id: index + 1,
                    label: `authenticated HTTP simulator ${index + 1}`,
                    origin: `http://127.0.0.1:${8098 + index}`,
                    secret: Array.from(
                      new TextEncoder().encode("alumina-development"),
                    ),
                    sampling: {
                      maximum_round_trip_ns: 1000000000,
                      maximum_device_processing_cycles: 2000000,
                      maximum_drift_ppm: 250,
                      maximum_sample_age_ns: 5000000000,
                      maximum_schedule_horizon_ns: 30000000000,
                      minimum_schedule_lead_ns: 500000000,
                      minimum_samples: 4,
                      maximum_timer_error_ns: 2000000,
                      maximum_uncertainty_cycles: 1000000,
                      heartbeat_interval_ms: 100,
                      runtime_health_interval_ms: 1000,
                    },
                  },
                },
              }),
            );
          }
          return;
        }
        if (event.kind === "job_snapshot") {
          const snapshot = event.snapshot;
          if (cachedJobClearing) {
            if (
              cachedJobRequest !== undefined &&
              snapshot.job_id === cachedJobRequest.job_id &&
              snapshot.phase === "complete"
            ) {
              return;
            }
            clearTimeout(timeout);
            finish("failed", {
              error: "cached-job state changed while awaiting terminal clear",
              latest_cached_job_snapshot: snapshot,
              completed_cached_jobs: completedCachedJobs,
            });
            return;
          }
          recordCachedJobSnapshot(snapshot);
          if (!cachedJobExpectation) {
            clearTimeout(timeout);
            finish("failed", {
              error: "unexpected cached-job snapshot",
              snapshot,
            });
            return;
          }
          if (snapshot.phase === "faulted") {
            clearTimeout(timeout);
            finish("failed", {
              error: "cached job faulted",
              cached_job_snapshot_count: cachedJobSnapshotCount,
              latest_cached_job_snapshot: latestCachedJobSnapshot,
              cached_job_transitions: cachedJobTransitions,
              device_snapshots: compactDeviceSnapshots(),
            });
            return;
          }
          if (snapshot.phase === "ready" && !cachedJobStarted) {
            cachedJobStarted = true;
            worker.postMessage(
              JSON.stringify({
                schema_version: 6,
                command: {
                  kind: "start_cached_job",
                  job_id: snapshot.job_id,
                },
              }),
            );
            return;
          }
          if (snapshot.phase === "complete") {
            const valid =
              cachedJobStarted &&
              cachedJobRequest !== undefined &&
              snapshot.job_id === cachedJobRequest.job_id &&
              snapshot.execution_mode === "simulation_only" &&
              snapshot.target_ui_ns !== null &&
              snapshot.consecutive_failures === 0 &&
              snapshot.last_error === null &&
              snapshot.participants.length === 2 &&
              snapshot.participants.every(
                (participant) =>
                  participant.cache_artifact === "complete" &&
                  participant.cache_phase === "complete" &&
                  participant.accepted_bytes === participant.total_bytes &&
                  participant.schedule_phase === "complete" &&
                  participant.local_start_cycle !== null,
              );
            const recoveryValid =
              (expectation !== "cached-job-recovery" ||
                (cachedJobFailureObservations.length >= 2 &&
                  cachedJobRecovered)) &&
              (expectation !== "cached-job-confirm-recovery" ||
                (cachedJobFailureObservations.length === 2 &&
                  cachedJobRecovered &&
                  cachedJobFailureObservations.every(
                    (observation, index) =>
                      observation.phase === "confirming" &&
                      observation.consecutive_failures === 1 &&
                      observation.last_error?.includes("fetch failed") &&
                      observation.participants.length === 2 &&
                      observation.participants.every(
                        (participant) =>
                          participant.cache_artifact === "complete" &&
                          participant.cache_phase === "complete" &&
                          participant.accepted_bytes ===
                            participant.total_bytes &&
                          (participant.schedule_phase === "installed" ||
                            participant.schedule_phase === "confirmed"),
                      ) &&
                      observation.participants.filter(
                        (participant) =>
                          participant.schedule_phase === "confirmed",
                      ).length === index,
                  )));
            if (!valid || !recoveryValid) {
              clearTimeout(timeout);
              finish("failed", {
                expectation,
                error: !valid
                  ? "terminal cached-job snapshot was invalid"
                  : "cached-job recovery evidence was not observed",
                cached_job_snapshot_count: cachedJobSnapshotCount,
                latest_cached_job_snapshot: latestCachedJobSnapshot,
                cached_job_transitions: cachedJobTransitions,
                cached_job_failure_observations:
                  cachedJobFailureObservations,
                cached_job_recovered: cachedJobRecovered,
                completed_cached_jobs: completedCachedJobs,
                device_snapshots: compactDeviceSnapshots(),
              });
              return;
            }
            completedCachedJobs.push({
              job_id: snapshot.job_id,
              cached_job_snapshot_count: cachedJobSnapshotCount,
              latest_cached_job_snapshot: latestCachedJobSnapshot,
              cached_job_transitions: [...cachedJobTransitions],
              cached_job_failure_observations: [
                ...cachedJobFailureObservations,
              ],
              cached_job_recovered: cachedJobRecovered,
            });
            if (cachedJobRequestIndex + 1 < cachedJobRequests.length) {
              cachedJobClearing = true;
              worker.postMessage(
                JSON.stringify({
                  schema_version: 6,
                  command: {
                    kind: "clear_cached_job",
                    job_id: snapshot.job_id,
                  },
                }),
              );
              return;
            }
            clearTimeout(timeout);
            finish("passed", {
              expectation,
              cached_job_snapshot_count: cachedJobSnapshotCount,
              latest_cached_job_snapshot: latestCachedJobSnapshot,
              cached_job_transitions: cachedJobTransitions,
              cached_job_failure_observations: cachedJobFailureObservations,
              cached_job_recovered: cachedJobRecovered,
              completed_cached_jobs: completedCachedJobs,
              device_snapshots: compactDeviceSnapshots(),
            });
            return;
          }
          return;
        }
        if (event.kind === "job_removed") {
          const nextIndex = cachedJobRequestIndex + 1;
          if (
            !cachedJobClearing ||
            cachedJobRequest === undefined ||
            event.job_id !== cachedJobRequest.job_id ||
            nextIndex >= cachedJobRequests.length
          ) {
            clearTimeout(timeout);
            finish("failed", {
              error: "unexpected cached-job removal",
              event,
              completed_cached_jobs: completedCachedJobs,
            });
            return;
          }
          cachedJobRequestIndex = nextIndex;
          cachedJobRequest = cachedJobRequests[cachedJobRequestIndex];
          cachedJobStaged = false;
          cachedJobStarted = false;
          cachedJobClearing = false;
          cachedJobSnapshotCount = 0;
          latestCachedJobSnapshot = undefined;
          cachedJobTransitions.length = 0;
          cachedJobFailureObservations.length = 0;
          cachedJobRecovered = false;
          priorCachedJobFailureState = undefined;
          priorCachedJobState = undefined;
          maybeStageCachedJob();
          return;
        }
        if (event.kind === "capability_document") {
          const capability = event.capability;
          if (capabilityDocuments.has(capability.connection_id)) {
            clearTimeout(timeout);
            finish("failed", {
              error: "capability document was emitted more than once for a connection",
              event_kinds: eventKinds,
              connection_id: capability.connection_id,
            });
            return;
          }
          const magic = capability.document.slice(0, 8);
          const validMagic =
            JSON.stringify(magic) ===
            JSON.stringify(Array.from(new TextEncoder().encode("ALMCAP04")));
          if (
            capability.connection_id < 1 ||
            capability.connection_id >
              (cachedJobExpectation ? 2 : 1) ||
            capability.generation < 1 ||
            capability.identity.document_bytes !== capability.document.length ||
            capability.identity.digest.length !== 32 ||
            !validMagic
          ) {
            clearTimeout(timeout);
            finish("failed", {
              error: "capability document event was malformed",
              capability,
            });
            return;
          }
          capabilityDocuments.set(capability.connection_id, capability);
          if (capability.connection_id === 1) capabilityDocument = capability;
          return;
        }
        if (event.kind === "telemetry_document") {
          if (cachedJobExpectation) return;
          const telemetry = event.telemetry;
          const subscription = Uint8Array.from(telemetry.subscription);
          const record = Uint8Array.from(telemetry.event);
          const subscriptionView = new DataView(subscription.buffer);
          const recordView = new DataView(record.buffer);
          const subscriptionMagic = new TextDecoder().decode(subscription.slice(0, 8));
          const eventMagic = new TextDecoder().decode(record.slice(0, 8));
          const eventSequence = Number(recordView.getBigUint64(56, true));
          const droppedEvents = Number(recordView.getBigUint64(64, true));
          const snapshotCycle = Number(recordView.getBigUint64(240, true));
          const overviewSequence = Number(recordView.getBigUint64(248, true));
          const sampleCount = recordView.getUint32(256, true);
          const previous = telemetryDocuments.at(-1);
          if (
            telemetry.connection_id !== 1 ||
            telemetry.generation < 1 ||
            subscription.length !== 176 ||
            record.length !== 432 ||
            subscriptionMagic !== "ALMTLS01" ||
            eventMagic !== "ALMTEV01" ||
            subscriptionView.getUint32(12, true) !== subscription.length ||
            recordView.getUint32(12, true) !== record.length ||
            subscriptionView.getBigUint64(16, true) !==
              recordView.getBigUint64(16, true) ||
            eventSequence === 0 ||
            overviewSequence !== eventSequence ||
            sampleCount !== 4 ||
            (previous !== undefined &&
              (eventSequence <= previous.event_sequence ||
                droppedEvents < previous.dropped_events ||
                snapshotCycle <= previous.snapshot_cycle))
          ) {
            clearTimeout(timeout);
            finish("failed", {
              error: "telemetry document event was malformed or regressed",
              telemetry,
              previous,
            });
            return;
          }
          telemetryDocuments.push({
            generation: telemetry.generation,
            event_sequence: eventSequence,
            dropped_events: droppedEvents,
            snapshot_cycle: snapshotCycle,
            subscription_bytes: subscription.length,
            event_bytes: record.length,
          });
          return;
        }
        if (event.kind === "waveform_document") {
          const maximumDocuments = expectation === "waveform-repeat" ? 2 : 1;
          if (waveformDocuments.length >= maximumDocuments) {
            clearTimeout(timeout);
            finish("failed", {
              error: "waveform document count exceeded the expectation",
              event_kinds: eventKinds,
              waveform_documents: waveformDocuments,
            });
            return;
          }
          const waveform = event.waveform;
          const magic = waveform.record.slice(0, 8);
          const captureId = waveform.record.slice(128, 144);
          const recordBytes = Uint8Array.from(waveform.record);
          const requestedDuration = Number(
            new DataView(recordBytes.buffer).getBigUint64(168, true),
          );
          const expectedDuration =
            expectation === "waveform-repeat" && waveformDocuments.length === 1
              ? 3000
              : 2000;
          const validMagic =
            JSON.stringify(magic) ===
            JSON.stringify(Array.from(new TextEncoder().encode("ALMDIG01")));
          if (
            waveform.connection_id !== 1 ||
            waveform.generation < 1 ||
            waveform.record.length < 224 ||
            captureId.every((byte) => byte === 0) ||
            requestedDuration !== expectedDuration ||
            !validMagic
          ) {
            clearTimeout(timeout);
            finish("failed", {
              error: "waveform document event was malformed",
              waveform,
            });
            return;
          }
          waveformDocument = waveform;
          waveformDocuments.push(waveform);
          return;
        }
        if (event.kind === "snapshot") {
          const snapshot = event.snapshot;
          latestSnapshot = snapshot;
          deviceSnapshots.set(snapshot.connection_id, snapshot);
          maybeStageCachedJob();
          const isolatedHealthFailure =
            snapshot.phase === "clock_qualified" &&
            snapshot.consecutive_failures === 0 &&
            snapshot.last_error === null &&
            snapshot.runtime_health_consecutive_failures >= 1 &&
            snapshot.runtime_health_last_error !== null;
          if (isolatedHealthFailure) {
            isolatedHealthFailureSnapshot = snapshot;
          }
          const isolatedCapabilityFailure =
            snapshot.consecutive_failures === 0 &&
            snapshot.last_error === null &&
            snapshot.capability_consecutive_failures >= 1 &&
            snapshot.capability_last_error !== null;
          if (isolatedCapabilityFailure) {
            isolatedCapabilityFailureSnapshot = snapshot;
          }
          const health = snapshot.runtime_health;
          const runtimeHealthAvailable =
            snapshot.runtime_health_availability === "available" &&
            health !== null &&
            health.command_queue.depth === 0 &&
            health.command_queue.capacity === 8 &&
            health.work_queue.depth === 0 &&
            health.work_queue.capacity === 8 &&
            health.telemetry_queue.depth === 1 &&
            health.telemetry_queue.capacity === 32 &&
            health.service_stack.domain === "service_core" &&
            health.service_stack.samples >= 1 &&
            health.realtime_stack !== null &&
            health.realtime_stack.domain === "realtime_core" &&
            health.realtime_stack.samples >= 1 &&
            health.realtime_stack_fresh === true &&
            snapshot.runtime_health_consecutive_failures === 0 &&
            snapshot.runtime_health_last_error === null;
          const qualified =
            snapshot.phase === "clock_qualified" &&
            snapshot.accepted_samples >= 5 &&
            snapshot.estimate !== null &&
            snapshot.history.length >= 4 &&
            runtimeHealthAvailable &&
            snapshot.capability_phase === "complete" &&
            snapshot.capability_identity !== null &&
            snapshot.capability_received_bytes ===
              snapshot.capability_identity.document_bytes &&
            snapshot.capability_consecutive_failures === 0 &&
            snapshot.capability_last_error === null &&
            snapshot.configuration_availability === "available" &&
            snapshot.configuration !== null &&
            snapshot.configuration.phase === "active" &&
            snapshot.configuration.jobs_authorized === true &&
            snapshot.configuration_consecutive_failures === 0 &&
            snapshot.configuration_last_error === null &&
            snapshot.device_identity !== null &&
            snapshot.device_identity.board_id === "sim-mks-tinybee-v1" &&
            snapshot.device_identity.device_id.length === 16 &&
            capabilityDocument !== undefined &&
            capabilityDocument.generation === snapshot.generation &&
            capabilityDocument.identity.document_bytes ===
              snapshot.capability_identity.document_bytes &&
            JSON.stringify(capabilityDocument.identity.digest) ===
              JSON.stringify(snapshot.capability_identity.digest);
          const waveformComplete =
            snapshot.waveform_phase === "complete" &&
            snapshot.waveform_capture_id !== null &&
            snapshot.waveform_received_bytes ===
              snapshot.waveform_total_bytes &&
            snapshot.waveform_total_bytes > 0 &&
            snapshot.waveform_consecutive_failures === 0 &&
            snapshot.waveform_last_error === null &&
            waveformDocument !== undefined &&
            waveformDocument.generation === snapshot.generation &&
            waveformDocument.record.length === snapshot.waveform_total_bytes &&
            JSON.stringify(waveformDocument.record.slice(128, 144)) ===
              JSON.stringify(snapshot.waveform_capture_id);
          const telemetryComplete =
            snapshot.telemetry_phase === "active" &&
            snapshot.telemetry_subscription_id !== null &&
            snapshot.telemetry_subscription_digest !== null &&
            snapshot.telemetry_subscription_digest.length === 32 &&
            snapshot.telemetry_event_sequence >= 2 &&
            snapshot.telemetry_dropped_events === 0 &&
            snapshot.telemetry_consecutive_failures === 0 &&
            snapshot.telemetry_last_error === null &&
            telemetryDocuments.length >= 2 &&
            telemetryDocuments.at(-1).generation === snapshot.generation &&
            telemetryDocuments.at(-1).event_sequence ===
              snapshot.telemetry_event_sequence;
          const conservativelyRejected =
            snapshot.rejected_samples >= 3 &&
            snapshot.accepted_samples === 0 &&
            snapshot.estimate === null;
          if (expectation === "qualified" && qualified) {
            clearTimeout(timeout);
            finish("passed", {
              expectation,
              capability_document: capabilityDocument,
              snapshot,
            });
          } else if (
            expectation === "telemetry" &&
            qualified &&
            telemetryComplete
          ) {
            clearTimeout(timeout);
            finish("passed", {
              expectation,
              capability_document: capabilityDocument,
              telemetry_documents: telemetryDocuments,
              snapshot,
            });
          } else if (
            expectation === "waveform" &&
            qualified &&
            !waveformRequested
          ) {
            waveformRequested = true;
            requestWaveform(2000);
            finish("sampling", snapshot);
          } else if (
            expectation === "waveform" &&
            qualified &&
            waveformComplete
          ) {
            clearTimeout(timeout);
            finish("passed", {
              expectation,
              capability_document: capabilityDocument,
              waveform_document: waveformDocument,
              snapshot,
            });
          } else if (
            expectation === "waveform-repeat" &&
            qualified &&
            !waveformRequested
          ) {
            waveformRequested = true;
            requestWaveform(2000);
            finish("sampling", snapshot);
          } else if (
            expectation === "waveform-repeat" &&
            qualified &&
            waveformComplete &&
            !repeatedWaveformRequested
          ) {
            repeatedWaveformRequested = true;
            firstWaveformCaptureId = JSON.stringify(
              snapshot.waveform_capture_id,
            );
            requestWaveform(3000);
            finish("sampling", snapshot);
          } else if (
            expectation === "waveform-repeat" &&
            qualified &&
            waveformComplete &&
            repeatedWaveformRequested &&
            waveformDocuments.length === 2 &&
            JSON.stringify(snapshot.waveform_capture_id) !==
              firstWaveformCaptureId
          ) {
            clearTimeout(timeout);
            finish("passed", {
              expectation,
              capability_document: capabilityDocument,
              waveform_documents: waveformDocuments,
              snapshot,
            });
          } else if (
            expectation === "health-retry" &&
            qualified &&
            isolatedHealthFailureSnapshot !== undefined
          ) {
            clearTimeout(timeout);
            finish("passed", {
              expectation,
              isolated_health_failure_snapshot: isolatedHealthFailureSnapshot,
              capability_document: capabilityDocument,
              recovered_snapshot: snapshot,
            });
          } else if (
            expectation === "capability-retry" &&
            qualified &&
            isolatedCapabilityFailureSnapshot !== undefined
          ) {
            clearTimeout(timeout);
            finish("passed", {
              expectation,
              isolated_capability_failure_snapshot:
                isolatedCapabilityFailureSnapshot,
              capability_document: capabilityDocument,
              recovered_snapshot: snapshot,
            });
          } else if (
            expectation === "conservative-rejection" &&
            conservativelyRejected
          ) {
            clearTimeout(timeout);
            finish("passed", { expectation, snapshot });
          } else {
            finish("sampling", snapshot);
          }
          return;
        }
        if (event.kind === "fatal" || event.kind === "command_rejected") {
          clearTimeout(timeout);
          finish("failed", event);
        }
      };
    </script>
  </body>
</html>
