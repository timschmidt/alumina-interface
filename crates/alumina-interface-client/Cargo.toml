[package]
name = "alumina-interface-client"
description = "Headless native Alumina protocol client and deterministic simulator transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
alumina-clock.workspace = true
alumina-job.workspace = true
alumina-net.workspace = true
alumina-protocol.workspace = true
alumina-storage.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Headers",
    "Location",
    "Performance",
    "Request",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "RequestRedirect",
    "Response",
    "Url",
    "Window",
    "WorkerGlobalScope",
    "WorkerLocation",
] }

[dev-dependencies]
alumina-machine-ir.workspace = true
