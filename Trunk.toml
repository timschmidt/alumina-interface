[build]
filehash = false

[[hooks]]
stage = "post_build"
command = "bash"
command_arguments = [
  "-c",
  '''
set -euo pipefail

optimized_wasm="$TRUNK_STAGING_DIR/alumina-interface_bg.wasm.opt"
wasm-opt \
  -Oz \
  --enable-bulk-memory \
  --enable-nontrapping-float-to-int \
  "$TRUNK_STAGING_DIR/alumina-interface_bg.wasm" \
  -o "$optimized_wasm"
mv "$optimized_wasm" "$TRUNK_STAGING_DIR/alumina-interface_bg.wasm"

gzip -fk -9 "$TRUNK_STAGING_DIR/index.html"
gzip -fk -9 "$TRUNK_STAGING_DIR/alumina-interface.js"
gzip -fk -9 "$TRUNK_STAGING_DIR/alumina-interface_bg.wasm"
brotli -q 11 -f \
  "$TRUNK_STAGING_DIR/alumina-interface_bg.wasm" \
  -o "$TRUNK_STAGING_DIR/alumina-interface_bg.wasm.br"
  ''',
]
