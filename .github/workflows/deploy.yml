name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Alumina Interface
        uses: actions/checkout@v4
        with:
          path: alumina-interface
          fetch-depth: 0

      - name: Check out Hypergraphics sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hypergraphics
          path: hypergraphics

      - name: Install Rust + Trunk
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install trunk
          cargo install wasm-opt
          cargo install wasm-tools

      - name: Build
        run: trunk build --release --public-url /alumina-interface/
        working-directory: alumina-interface

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./alumina-interface/dist
          publish_branch: gh-pages
          force_orphan: true
