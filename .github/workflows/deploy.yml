name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to publish the gh-pages branch.
    steps:
      - name: Check out Alumina Interface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: alumina-interface
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Alumina firmware protocol sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/alumina-firmware
          ref: 96ac22cadef311f069d62bae4dfa5f3918cfc143
          path: alumina-firmware
          persist-credentials: false

      - name: Check out CSGRS sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/csgrs
          ref: c1a5fdd17adb475545e403dbdcc9ed4ee6804af6
          path: csgrs
          persist-credentials: false

      - name: Record interval stack revisions
        run: |
          for repo in alumina-interface csgrs alumina-firmware; do
            echo "$repo $(git -C "$repo" rev-parse HEAD)"
          done

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Install web build tools
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: trunk@0.21.14,wasm-opt,wasm-tools

      - name: Install asset compressor
        run: |
          sudo apt-get update
          sudo apt-get install --yes brotli

      - name: Test exact and protocol cores
        run: cargo test --workspace --locked
        working-directory: alumina-interface

      - name: Lint native interface sources
        run: cargo clippy --workspace --all-targets --no-deps --locked -- -D warnings
        working-directory: alumina-interface

      - name: Lint browser interface sources
        run: cargo clippy --workspace --target wasm32-unknown-unknown --no-deps --locked -- -D warnings
        working-directory: alumina-interface

      - name: Audit all interval consumer lockfiles, sibling sources and Interface licenses
        run: |
          python3 -B scripts/test-audit-sibling-sources.py
          bash scripts/audit-source-policy.sh --coordinated --fetch
        working-directory: alumina-interface

      - name: Test native, embedded and linked WebAssembly consumers
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/interval-consumers
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target wasm32-unknown-unknown,thumbv7em-none-eabihf
          rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
          scripts/check-interval-consumers.sh
          cargo clean --target-dir "$CARGO_TARGET_DIR"
        working-directory: alumina-interface

      - name: Build
        run: trunk build --release --locked --public-url /alumina-interface/
        working-directory: alumina-interface

      - name: Validate production artifacts
        run: |
          wasm-tools validate dist/alumina-interface_bg.wasm
          gzip -t dist/index.html.gz
          gzip -t dist/alumina-interface.js.gz
          gzip -t dist/alumina-interface_bg.wasm.gz
          brotli -t dist/alumina-interface_bg.wasm.br
        working-directory: alumina-interface

      - name: Deploy
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./alumina-interface/dist
          publish_branch: gh-pages
          force_orphan: true
